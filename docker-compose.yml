
version: '3.7'
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=nm-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
    ports:
      - "9000:9000"
      - "9870:9870"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_NAMENODE_URI=hdfs://namenode:9000
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  # --- NOWE: jednorazowa inicjalizacja HDFS (katalogi i prawa) ---
  hdfs-init:
    image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-init
    depends_on:
      - namenode
      - datanode
    environment:
      - HADOOP_CONF_DIR=/etc/hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./hadoop/conf:/etc/hadoop
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
        echo 'Waiting for NameNode RPC...';
        until echo 'exit' | nc namenode 9000; do sleep 2; done;

        echo 'INIT as ROOT — creating directory structure';
        export HADOOP_USER_NAME=root;

        hdfs dfs -mkdir -p /user/hdfs/electricitymaps/zone_PL;

        echo 'Changing ownership to HDFS user...';
        hdfs dfs -chown -R hdfs:supergroup /user/hdfs

        echo 'Setting permissions...';
        hdfs dfs -chmod -R 775 /user/hdfs

        echo 'Listing directories...';
        hdfs dfs -ls -R /user/hdfs
      "

  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    ports:
      - "8080:8080"
    volumes:
      - ./nifi:/opt/nifi/nifi-current/templates
      - nifi_state:/opt/nifi/nifi-current/flow
    environment:
      - NIFI_WEB_HTTP_HOST=0.0.0.0
      - NIFI_WEB_HTTP_PORT=8080
    depends_on:
      - hdfs-ingester

  hdfs-ingester:
    build: ./hdfs_ingester
    container_name: hdfs-ingester
    environment:
      - NAMENODE_HOST=namenode
      - NAMENODE_PORT=9870
      - HDFS_USER=hdfs
      - DATANODE_HOST=datanode
      - DATANODE_PORT=9864
    depends_on:
      - namenode
      - datanode
      - hdfs-init
    ports:
      - "5050:5000"

  tester:
    build: ./tests
    container_name: tester
    environment:
      - ELECTRICITYMAPS_TOKEN=${ELECTRICITYMAPS_TOKEN}
      - NAMENODE_HOST=namenode
      - NAMENODE_PORT=9870
    depends_on:
      - nifi
      - hdfs-ingester
      - namenode

volumes:
  hdfs_namenode:
  hdfs_datanode:
  nifi_state:
